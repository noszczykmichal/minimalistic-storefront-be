services:
  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql
    ports:
      - 5432:5432

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080
